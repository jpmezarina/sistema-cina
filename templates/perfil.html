{% extends "base.html" %}
{% block title %}Mi Perfil - CINA{% endblock %}
{% block page_title %}Mi Perfil{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card mb-4">
            <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>Datos de Acceso</h5></div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label small text-muted mb-0">Código de Acceso</label>
                        <div><code class="fs-6">{{ current_user.codigo_acceso }}</code></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-muted mb-0">Rol</label>
                        <div><span class="badge bg-secondary text-uppercase">{{ current_user.rol }}</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Mis Datos</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombres</label>
                            <input type="text" name="nombres" class="form-control" value="{{ current_user.nombres }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="apellidos" class="form-control" value="{{ current_user.apellidos }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ current_user.telefono or '' }}">
                    </div>

                    <hr>
                    <h6 class="mb-3"><i class="bi bi-shield-lock me-2"></i>Cambiar Contraseña <small class="text-muted fw-normal">(opcional)</small></h6>
                    <div class="mb-3">
                        <label class="form-label">Contraseña Actual</label>
                        <input type="password" name="password_actual" class="form-control" placeholder="Requerida solo si cambias la contraseña">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nueva Contraseña</label>
                            <input type="password" name="password_nueva" class="form-control" minlength="6">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirmar Nueva Contraseña</label>
                            <input type="password" name="password_confirmar" class="form-control" minlength="6">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
